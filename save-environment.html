    <style>
      .pranam-link {
        position: fixed;
        right: 2vw;
        bottom: 2vw;
        width: 10vw;
        height: 7vw;
        background-image: url("./assets/images/arowAsset.png");
        background-position: center;
        background-repeat: no-repeat;
        background-size: contain;
        z-index: 999999;
        display: flex;
        justify-content: center;
        align-items: center;
        opacity: 0;
        visibility: hidden;
        position: absolute;
        text-decoration: none;
        pointer-events: auto;
        cursor: pointer;
        color: white;
        font-size: 1.7vw;
        padding-right: 2vw;
        text-shadow: 0.15vw 0.15vw 0.1vw rgba(0, 0, 0, 0.766);
      }

      @keyframes pranamPop {
        0% {
          transform: scale(1);
        }

        50% {
          transform: scale(1.12);
        }

        100% {
          transform: scale(1);
        }
      }

      .pranam-link.show {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
      }

      /* ================= VIDEO BUTTON (slide 5 only) ================= */

      .video-btn {
         position: fixed;
      bottom: 2.5vw;
        left: 10vw;
        transform: translateX(-50%);
        z-index: 1000;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transform: translateX(-50%) translateY(1vw);
        transition:
          opacity 0.35s ease,
          visibility 0.35s ease,
          transform 0.35s ease;
      }

      .video-btn.show {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
        transform: translateX(-50%) translateY(0);
      }

      .start-video-btn {
        border: none;
        background-color: transparent;
        background-image: url("./assets/images/watch.png");
        background-position: center;
        background-repeat: no-repeat;
        background-size: contain;
        display: flex;
        align-items: center;
        justify-content: space-between;
        cursor: pointer;
        width: 14vw;
        height: 5vw;
        transition:
          transform 0.25s ease,
          background 0.25s ease,
          box-shadow 0.25s ease;
      }

      .start-video-btn:active {
        transform: scale(0.98);
      }

 .start-text {
        font-size: 1.4vw;
        font-weight: 900;
        letter-spacing: 0.1vw;
        color: #ffffff;
        line-height: 1;
          font-family: "BalooRegular";
        text-align: end;
        width: 100%;
        padding-right: 1vw;
      }

      body[data-lang="hi"] .start-text {
        font-size: 1.5vw !important;
      }

      body[data-lang="gu"] .start-text {
        font-size: 1.5vw !important;
      }

      /* ================= BLUR WHILE POPUP OPEN ================= */

      nav,
      .page-content,
      .page-tooltip,
      .pranam-link {
        transition:
          filter 0.4s ease,
          transform 0.4s ease;
      }

      body.video-open nav,
      body.video-open .page-content,
      body.video-open .page-tooltip,
      body.video-open .pranam-link {
        filter: blur(0.45vw);
        pointer-events: none;
        user-select: none;
      }

      /* ================= VIDEO POPUP ================= */

      .play-icon i,
      .close-video-btn i,
      .video-center-play i,
      .control-btn i {
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        flex: 0 0 auto;
      }

      .close-video-btn i {
        width: 1.8vw;
        min-width: 1.8vw;
        max-width: 1.8vw;
      }

      .video-center-play i {
        width: 2.2vw;
        min-width: 2.2vw;
        max-width: 2.2vw;
      }

      .control-btn i {
        width: 1.4vw;
        min-width: 1.4vw;
        max-width: 1.4vw;
      }

      .video-popup {
        position: fixed;
        inset: 0;
        z-index: 9999999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.38);
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition:
          opacity 0.35s ease,
          visibility 0.35s ease;
      }

      .video-popup.active {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
      }

      .video-box {
        position: relative;
        width: 68vw;
        aspect-ratio: 16 / 9;
        border-radius: 2vw;
        background: #5d9e28c2;
        padding: 0.75vw;
        border: 0.25vw solid white;
        box-shadow: 0 1vw 3vw rgba(0, 0, 0, 0.45);
        transform: scale(0.82);
        opacity: 0;
        transition:
          transform 0.4s cubic-bezier(0.22, 1, 0.36, 1),
          opacity 0.35s ease;
        backdrop-filter: blur(0.5vw);
        -webkit-backdrop-filter: blur(0.5vw);
      }

      .video-popup.active .video-box {
        transform: scale(1);
        opacity: 1;
      }

      .popup-video-frame {
        position: relative;
        width: 100%;
        height: 100%;
        border-radius: 1.4vw;
        overflow: hidden;
        background: #000;
        border: 0.18vw solid #5e9e28;
      }

      .popup-video {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
        background: #000;
      }

      .close-video-btn {
        position: absolute;
        top: -1.35vw;
        right: -1.35vw;
        width: 3.4vw;
        height: 3.4vw;
        border: none;
        border-radius: 50%;
        background: #ffffff;
        color: #5e9e28;
        font-size: 1.8vw;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        z-index: 10;
        box-shadow: 0 0.35vw 1vw rgba(0, 0, 0, 0.35);
        transition:
          transform 0.25s ease,
          background 0.25s ease,
          color 0.25s ease;
      }

      .close-video-btn:hover {
        transform: rotate(90deg) scale(1.08);
        background: #5e9e28;
        color: #ffffff;
      }

      .custom-controls {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 5;
        padding: 1vw;
        display: flex;
        flex-direction: column;
        gap: 0.75vw;
        background: linear-gradient(
          to top,
          rgba(7, 178, 27, 0.35),
          rgba(4, 113, 15, 0.35),
          rgba(229, 141, 42, 0)
        );
        opacity: 1;
        transition: opacity 0.25s ease;
      }

      .popup-video-frame.controls-hidden .custom-controls {
        opacity: 0;
        pointer-events: none;
      }

      .progress-wrap {
        width: 100%;
        display: flex;
        align-items: center;
      }

      .video-progress {
        width: 100%;
        appearance: none;
        -webkit-appearance: none;
        height: 0.45vw;
        border-radius: 5vw;
        background: rgba(255, 255, 255, 0.35);
        cursor: pointer;
        overflow: hidden;
        pointer-events: auto;
      }

      .video-progress::-webkit-slider-thumb {
        appearance: none;
        -webkit-appearance: none;
        width: 1vw;
        height: 1vw;
        border-radius: 50%;
        background: #ffffff;
        box-shadow: -70vw 0 0 69.6vw #ffffff;
        cursor: pointer;
      }

      .video-progress::-moz-range-thumb {
        width: 1vw;
        height: 1vw;
        border: none;
        border-radius: 50%;
        background: #ffffff;
        cursor: pointer;
      }

      .video-progress::-moz-range-progress {
        height: 0.45vw;
        border-radius: 5vw;
        background: #ffffff;
      }

      .control-row {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1vw;
      }

      .control-left,
      .control-right {
        display: flex;
        align-items: center;
        gap: 0.8vw;
      }

      .control-btn {
        width: 2.8vw;
        min-width: 2.8vw;
        max-width: 2.8vw;
        height: 2.8vw;
        border: none;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.24);
        color: #ffffff;
        font-size: 1.2vw;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition:
          background 0.25s ease,
          color 0.25s ease,
          transform 0.25s ease;
      }

      .control-btn:hover {
        background: #ffffff;
        color: #5e9e28;
        transform: scale(1.08);
      }

      .time-text {
        color: #ffffff;
        font-size: 1.05vw;
        font-weight: 700;
        font-family: Arial, sans-serif;
        letter-spacing: 0.05vw;
        min-width: 8vw;
      }

      .volume-range {
        width: 7vw;
        appearance: none;
        -webkit-appearance: none;
        height: 0.4vw;
        border-radius: 5vw;
        background: rgba(255, 255, 255, 0.35);
        cursor: pointer;
      }

      .volume-range::-webkit-slider-thumb {
        appearance: none;
        -webkit-appearance: none;
        width: 0.9vw;
        height: 0.9vw;
        border-radius: 50%;
        background: #ffffff;
        cursor: pointer;
      }

      .volume-range::-moz-range-thumb {
        width: 0.9vw;
        height: 0.9vw;
        border: none;
        border-radius: 50%;
        background: #ffffff;
        cursor: pointer;
      }

      .video-center-play {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 6vw;
        min-width: 6vw;
        max-width: 6vw;
        height: 6vw;
        border: 0.22vw solid rgba(255, 255, 255, 0.85);
        border-radius: 50%;
        background: #33600f;
        color: #ffffff;
        font-size: 2.2vw;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transform: translate(-50%, -50%) scale(1);
        z-index: 4;
        transition:
          opacity 0.25s ease,
          transform 0.25s ease,
          background 0.25s ease;
      }

      .video-center-play.hide {
        opacity: 0;
        pointer-events: none;
        transform: translate(-50%, -50%) scale(0.8);
      }

      .video-center-play:hover {
        background: rgba(229, 141, 42, 0.82);
        transform: translate(-50%, -50%) scale(1.08);
      }

      .video-box:fullscreen {
        width: 100%;
        height: 100%;
        border-radius: 0;
        padding: 0;
        background: #000;
      }

      .video-box:fullscreen .popup-video-frame {
        border-radius: 0;
        border: none;
      }

      .video-box:fullscreen .close-video-btn {
        top: 1.5vw;
        right: 1.5vw;
      }
    </style>
  </head>

    <script>
      (() => {
        const texts = [
          `By <br/> Using cloth bags`,
          `By <br/> Turning off lights, <br/> fans, etc. When not in <br/> use`,
          `By <br/> Using reusable <br/> bottles or cups`,
          `By <br/> Avoiding shower <br/> baths`,
          `By <br/> Reducing <br/> paper wastage`,
          `By <br/> Using glass of water <br/> for brushing`,
          `By <br/> Reducing use of <br/> packaged <br/> food`,
        ];

        const boardText = document.getElementById("boardText");
        const nextBtn = document.querySelector(".env-next");
        const prevBtn = document.querySelector(".env-prev");
        const pranamLink = document.querySelector(".pranam-link");
        const videoBtnWrap = document.querySelector(".video-btn");

        const pageLoadAudio = document.getElementById("pageLoadAudio");
        const navAudio = document.getElementById("NavigateClick");
        const homeAudio = document.getElementById("HomePage");
        const swipeEffect = document.getElementById("SwipeEffect");

        const englishAudio = document.getElementById("englishAudio");
        const hindiAudio = document.getElementById("hindiAudio");
        const gujratiAudio = document.getElementById("gujratiAudio");

        const englishBtn = document.querySelector(".english-button");
        const hindiBtn = document.querySelector(".hindi-button");
        const gujratiBtn = document.querySelector(".gujrati-button");

        const homeLink = document.querySelector(".home-btn a");
        const pages = document.querySelector(".pages");

        // 5th slide (zero-based index)
        const VIDEO_SLIDE_INDEX = 4;

        function playAudio(audio) {
          if (!audio) return;

          audio.pause();
          audio.currentTime = 0;

          audio.play().catch(() => {});
        }

        function stopAudio(audio) {
          if (!audio) return;

          audio.pause();
          audio.currentTime = 0;
        }

        /* ==============================
           PAGE LOAD AUDIO
        ============================== */

        function playPageLoadAudio() {
          if (!pageLoadAudio) return;

          pageLoadAudio.pause();
          pageLoadAudio.currentTime = 0;

          pageLoadAudio.play().catch(() => {
            console.log(
              "Page load audio blocked. It will play after first click.",
            );
          });
        }

        window.addEventListener("load", () => {
          playPageLoadAudio();
        });

        document.addEventListener(
          "pointerdown",
          () => {
            if (pageLoadAudio && pageLoadAudio.paused) {
              playPageLoadAudio();
            }
          },
          { once: true },
        );

        document.addEventListener(
          "touchstart",
          () => {
            if (pageLoadAudio && pageLoadAudio.paused) {
              playPageLoadAudio();
            }
          },
          { once: true },
        );

        /* ==============================
           LANGUAGE BUTTON AUDIO (click only)
        ============================== */

        function addLanguageButtonAudio(button, languageAudio) {
          if (!button) return;

          button.addEventListener("click", () => {
            playAudio(languageAudio);
          });
        }

        addLanguageButtonAudio(englishBtn, englishAudio);
        addLanguageButtonAudio(hindiBtn, hindiAudio);
        addLanguageButtonAudio(gujratiBtn, gujratiAudio);

        function updateBoardText(index) {
          if (!boardText) return;

          const html = texts[index] ?? texts[0] ?? "";
          boardText.innerHTML = `<h2>${html}</h2>`;
        }

        function fadeAndGo(url) {
          document.documentElement.classList.add("page-exit");

          window.setTimeout(() => {
            window.location.href = url;
          }, 200);
        }

        /* ==============================
           SWIPER SLIDE EFFECT AUDIO
        ============================== */

        function playSlideEffect() {
          playAudio(swipeEffect);
        }

        /* ==============================
           PREV / NEXT BUTTON DISABLED STATE
           (opacity only, never hidden)
        ============================== */

        function updatePrevBtnState(isBeginning) {
          if (!prevBtn) return;

          prevBtn.style.opacity = isBeginning ? "0.5" : "1";
          prevBtn.style.pointerEvents = isBeginning ? "none" : "auto";
        }

        function updateNextBtnState(isEnd) {
          if (!nextBtn) return;

          nextBtn.style.opacity = isEnd ? "0.5" : "1";
          nextBtn.style.pointerEvents = isEnd ? "none" : "auto";
        }

        /* ==============================
           PRANAM LINK VISIBILITY
           (hidden initially, shown on last slide)
        ============================== */

        function updatePranamLinkState(isEnd) {
          if (!pranamLink) return;

          pranamLink.classList.toggle("show", isEnd);
        }

        /* ==============================
           VIDEO BUTTON VISIBILITY
           (only on the 5th slide)
        ============================== */

        function updateVideoBtnState(index) {
          if (!videoBtnWrap) return;

          const shouldShow = index === VIDEO_SLIDE_INDEX;

          videoBtnWrap.classList.toggle("show", shouldShow);

          // If the user swipes away while the popup is open, close it
          if (!shouldShow) {
            window.closeEnvVideoPopup?.();
          }
        }

        window.swiper = new Swiper(".imageSwiper", {
          loop: false,
          speed: 600,

          pagination: {
            el: ".env-pagination",
            clickable: true,
          },

          navigation: {
            prevEl: ".env-prev",
          },

          on: {
            init: function () {
              updatePrevBtnState(this.isBeginning);
              updateNextBtnState(this.isEnd);
              updatePranamLinkState(this.isEnd);
              updateVideoBtnState(this.realIndex);
              updateBoardText(this.realIndex);

              const saved =
                localStorage.getItem("selectedLanguage") || "English";
              window.setLanguage?.(saved);
            },

            slideChangeTransitionStart: function () {
              playSlideEffect();
            },

            slideChange: function () {
              updatePrevBtnState(this.isBeginning);
              updateNextBtnState(this.isEnd);
              updatePranamLinkState(this.isEnd);
              updateVideoBtnState(this.realIndex);
              updateBoardText(this.realIndex);

              const saved =
                localStorage.getItem("selectedLanguage") || "English";
              window.setLanguage?.(saved);
            },
          },
        });

        if (nextBtn) {
          nextBtn.addEventListener("click", (e) => {
            e.preventDefault();

            const s = window.swiper;
            if (!s) return;

            if (s.isEnd) return;

            s.slideNext();
          });
        }

        if (prevBtn) {
          prevBtn.addEventListener("click", () => {
            const s = window.swiper;
            if (!s || s.isBeginning) return;

            s.slidePrev();
          });
        }

        if (homeLink && homeAudio) {
          homeLink.addEventListener("click", (e) => {
            if (document.body.classList.contains("intro")) return;

            e.preventDefault();

            const href = homeLink.getAttribute("href");
            if (!href) return;

            playAudio(homeAudio);

            setTimeout(() => {
              window.location.href = href;
            }, 800);
          });
        }

        if (pages && navAudio) {
          pages.addEventListener("click", (e) => {
            const a = e.target.closest("a");
            if (!a || !pages.contains(a)) return;
            if (document.body.classList.contains("intro")) return;

            e.preventDefault();

            const href = a.getAttribute("href");
            if (!href) return;

            playAudio(navAudio);

            setTimeout(() => {
              window.location.href = href;
            }, 500);
          });
        }

        const unlockAudio = async () => {
          const audios = [
            pageLoadAudio,
            navAudio,
            homeAudio,
            swipeEffect,
            englishAudio,
            hindiAudio,
            gujratiAudio,
          ];

          for (const audio of audios) {
            try {
              if (!audio) continue;

              audio.muted = true;
              await audio.play();
              audio.pause();
              audio.currentTime = 0;
              audio.muted = false;
            } catch (_) {}
          }

          document.removeEventListener("pointerdown", unlockAudio);
          document.removeEventListener("touchstart", unlockAudio);
        };

        document.addEventListener("pointerdown", unlockAudio, { once: true });
        document.addEventListener("touchstart", unlockAudio, { once: true });
      })();
    </script>

    <!-- ================= VIDEO POPUP PLAYER ================= -->
    <script>
      (() => {
        const videoPlayClickSound = new Audio("./assets/audio/5.mp3");

        function playClickSound(audio) {
          audio.currentTime = 0;
          audio.play().catch((err) => {
            console.error("Error playing click sound:", err);
          });
        }

        const startVideoBtn = document.querySelector(".start-video-btn");
        const videoPopup = document.querySelector(".video-popup");
        const videoBox = document.querySelector(".video-box");
        const closeVideoBtn = document.querySelector(".close-video-btn");
        const popupVideo = document.querySelector(".popup-video");
        const popupVideoFrame = document.querySelector(".popup-video-frame");

        if (!videoPopup || !popupVideo) return;

        const centerPlayBtn = document.querySelector(".video-center-play");
        const playPauseBtn = document.querySelector(".play-pause-btn");
        const playPauseIcon = playPauseBtn.querySelector("i");
        const centerPlayIcon = centerPlayBtn.querySelector("i");

        const videoProgress = document.querySelector(".video-progress");
        const currentTimeText = document.querySelector(".current-time");
        const totalTimeText = document.querySelector(".total-time");

        const muteBtn = document.querySelector(".mute-btn");
        const muteIcon = muteBtn.querySelector("i");
        const volumeRange = document.querySelector(".volume-range");

        const fullscreenBtn = document.querySelector(".fullscreen-btn");
        const fullscreenIcon = fullscreenBtn.querySelector("i");

        // Background slide videos (paused while the popup is open)
        const slideVideos = document.querySelectorAll(".imageSwiper video");

        let controlsTimer;
        let lastVolume = 1;
        let savedVideoTime = 0;
        let isProgressDragging = false;

        function formatTime(time) {
          if (!time || isNaN(time)) return "0:00";

          const minutes = Math.floor(time / 60);
          const seconds = Math.floor(time % 60);

          return `${minutes}:${seconds < 10 ? "0" : ""}${seconds}`;
        }

        function updatePlayIcons() {
          if (popupVideo.paused) {
            playPauseIcon.className = "fa-solid fa-play";
            centerPlayIcon.className = "fa-solid fa-play";
            centerPlayBtn.classList.remove("hide");
          } else {
            playPauseIcon.className = "fa-solid fa-pause";
            centerPlayIcon.className = "fa-solid fa-pause";
            centerPlayBtn.classList.add("hide");
          }
        }

        function updateProgress() {
          if (!popupVideo.duration) return;

          savedVideoTime = popupVideo.currentTime;

          if (!isProgressDragging) {
            const progressValue =
              (popupVideo.currentTime / popupVideo.duration) * 100;

            videoProgress.value = progressValue;
          }

          currentTimeText.textContent = formatTime(popupVideo.currentTime);
          totalTimeText.textContent = formatTime(popupVideo.duration);
        }

        // Free scrubbing: user can drag forward or backward anywhere on the bar
        function handleProgressInput() {
          if (!popupVideo.duration) return;

          isProgressDragging = true;

          const selectedTime =
            (Number(videoProgress.value) / 100) * popupVideo.duration;

          currentTimeText.textContent = formatTime(selectedTime);
        }

        function handleProgressChange() {
          if (!popupVideo.duration) return;

          const selectedTime =
            (Number(videoProgress.value) / 100) * popupVideo.duration;

          popupVideo.currentTime = selectedTime;
          savedVideoTime = selectedTime;

          isProgressDragging = false;
          updateProgress();
        }

        function updateMuteIcon() {
          if (popupVideo.muted || popupVideo.volume === 0) {
            muteIcon.className = "fa-solid fa-volume-xmark";
          } else if (popupVideo.volume < 0.5) {
            muteIcon.className = "fa-solid fa-volume-low";
          } else {
            muteIcon.className = "fa-solid fa-volume-high";
          }
        }

        function togglePlay() {
          if (popupVideo.paused) {
            popupVideo.play().catch(() => {});
          } else {
            popupVideo.pause();
          }
        }

        function openVideoPopup() {
          document.body.classList.add("video-open");
          videoPopup.classList.add("active");

          slideVideos.forEach((v) => v.pause());

          popupVideo.volume = Number(volumeRange.value);
          popupVideo.muted = false;

          if (savedVideoTime > 0) {
            popupVideo.currentTime = savedVideoTime;
          }

          updateMuteIcon();
          updatePlayIcons();
          updateProgress();

          setTimeout(() => {
            popupVideo.play().catch(() => {});
          }, 250);
        }

        function closeVideoPopup() {
          if (!videoPopup.classList.contains("active")) return;

          savedVideoTime = popupVideo.currentTime;

          popupVideo.pause();

          videoPopup.classList.remove("active");
          document.body.classList.remove("video-open");

          slideVideos.forEach((v) => v.play().catch(() => {}));

          if (document.fullscreenElement) {
            document.exitFullscreen().catch(() => {});
          }

          updatePlayIcons();
        }

        // Exposed so the swiper can close the popup when leaving slide 5
        window.closeEnvVideoPopup = closeVideoPopup;

        function toggleMute() {
          if (popupVideo.muted || popupVideo.volume === 0) {
            popupVideo.muted = false;
            popupVideo.volume = lastVolume || 1;
            volumeRange.value = popupVideo.volume;
          } else {
            lastVolume = popupVideo.volume;
            popupVideo.muted = true;
            volumeRange.value = 0;
          }

          updateMuteIcon();
        }

        function changeVolume() {
          const volumeValue = Number(volumeRange.value);

          popupVideo.volume = volumeValue;
          popupVideo.muted = volumeValue === 0;

          if (volumeValue > 0) {
            lastVolume = volumeValue;
          }

          updateMuteIcon();
        }

        function toggleFullscreen() {
          if (!document.fullscreenElement) {
            videoBox.requestFullscreen().catch(() => {});
          } else {
            document.exitFullscreen().catch(() => {});
          }
        }

        function updateFullscreenIcon() {
          fullscreenIcon.className = document.fullscreenElement
            ? "fa-solid fa-compress"
            : "fa-solid fa-expand";
        }

        function showControlsTemporarily() {
          popupVideoFrame.classList.remove("controls-hidden");

          clearTimeout(controlsTimer);

          if (!popupVideo.paused) {
            controlsTimer = setTimeout(() => {
              popupVideoFrame.classList.add("controls-hidden");
            }, 2200);
          }
        }

        if (startVideoBtn) {
          startVideoBtn.addEventListener("click", () => {
            playClickSound(videoPlayClickSound);
            openVideoPopup();
          });
        }

        if (closeVideoBtn) {
          closeVideoBtn.addEventListener("click", closeVideoPopup);
        }

        videoPopup.addEventListener("click", (e) => {
          if (e.target === videoPopup) {
            closeVideoPopup();
          }
        });

        popupVideo.addEventListener("click", togglePlay);
        popupVideo.addEventListener("play", updatePlayIcons);
        popupVideo.addEventListener("pause", updatePlayIcons);
        popupVideo.addEventListener("timeupdate", updateProgress);
        popupVideo.addEventListener("loadedmetadata", updateProgress);

        popupVideo.addEventListener("ended", () => {
          savedVideoTime = 0;
          videoProgress.value = 0;
          currentTimeText.textContent = "0:00";
          updatePlayIcons();
        });

        popupVideo.addEventListener("contextmenu", (e) => {
          e.preventDefault();
        });

        videoProgress.addEventListener("input", handleProgressInput);
        videoProgress.addEventListener("change", handleProgressChange);

        videoProgress.addEventListener("mousedown", () => {
          isProgressDragging = true;
        });

        videoProgress.addEventListener("touchstart", () => {
          isProgressDragging = true;
        });

        centerPlayBtn.addEventListener("click", togglePlay);
        playPauseBtn.addEventListener("click", togglePlay);
        muteBtn.addEventListener("click", toggleMute);
        volumeRange.addEventListener("input", changeVolume);
        fullscreenBtn.addEventListener("click", toggleFullscreen);

        popupVideoFrame.addEventListener("mousemove", showControlsTemporarily);
        popupVideoFrame.addEventListener("click", showControlsTemporarily);

        document.addEventListener("fullscreenchange", updateFullscreenIcon);

        document.addEventListener("keydown", (e) => {
          if (!videoPopup.classList.contains("active")) return;
          if (!e.key) return;

          if (e.key === "Escape") {
            closeVideoPopup();
          }

          if (e.code === "Space") {
            e.preventDefault();
            togglePlay();
          }

          if (e.key.toLowerCase() === "m") {
            toggleMute();
          }

          if (e.key.toLowerCase() === "f") {
            toggleFullscreen();
          }
        });
      })();
    </script>
  </body>
</html>
