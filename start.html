    <script>
      (() => {
        const LANG_KEY = "selectedLanguage";
        const DEFAULT_LANG = "English";
        let translations = null;

        // ================= LANDSCAPE ALERT =================

        let landscapeAlertShown = false;

        function checkScreenSize() {
          const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(
            navigator.userAgent,
          );

          if (isMobile && window.innerWidth < 768) {
            if (!landscapeAlertShown) {
              landscapeAlertShown = true;
              alert("Please use Landscape!");
            }
          } else {
            landscapeAlertShown = false;
          }
        }

        window.addEventListener("load", checkScreenSize);
        window.addEventListener("resize", checkScreenSize);

        const savedBeforeLoad = localStorage.getItem(LANG_KEY);

        if (savedBeforeLoad) {
          document.documentElement.setAttribute("lang", savedBeforeLoad);

          document.addEventListener("DOMContentLoaded", () => {
            document.body.setAttribute(
              "data-lang",
              savedBeforeLoad === "Hindi"
                ? "hi"
                : savedBeforeLoad === "Gujarati"
                  ? "gu"
                  : "en",
            );
          });
        }

        async function loadTranslations() {
          if (translations) return translations;

          try {
            const res = await fetch("./JSON/data.json");
            if (!res.ok) throw new Error("JSON not found");
            translations = await res.json();
          } catch (err) {
            console.error("Translation load failed:", err);
            translations = {};
          }

          return translations;
        }

        function setActiveUI(lang) {
          const container = document.querySelector(".navbar-language");
          if (!container) return;

          container.classList.remove("lang-left", "lang-right", "lang-middle");

          if (lang === "English") {
            container.classList.add("lang-left");
          } else if (lang === "Gujarati") {
            container.classList.add("lang-right");
          } else if (lang === "Hindi") {
            container.classList.add("lang-middle");
          }

          document.querySelectorAll(".navbar-language > div").forEach((btn) => {
            btn.classList.remove("lang-active");
          });

          const mapBtn = {
            English: ".english-button",
            Hindi: ".hindi-button",
            Gujarati: ".gujrati-button",
          };

          document.querySelector(mapBtn[lang])?.classList.add("lang-active");
        }

        function applyLanguage(lang) {
          if (!translations || !translations[lang]) {
            lang = DEFAULT_LANG;
          }

          document.documentElement.setAttribute("lang", lang);

          document.body.setAttribute(
            "data-lang",
            lang === "Hindi" ? "hi" : lang === "Gujarati" ? "gu" : "en",
          );

          setActiveUI(lang);

          if (!translations || !translations[lang]) return;

          document.querySelectorAll("[data-lang-key]").forEach((el) => {
            const key = el.getAttribute("data-lang-key");
            const value = translations[lang][key];

            if (value == null) return;

            if (String(value).includes("<br")) {
              el.innerHTML = value;
            } else {
              el.textContent = value;
            }
          });

          localStorage.setItem(LANG_KEY, lang);
        }

        function playAudio(audio) {
          if (!audio) return;

          audio.pause();
          audio.currentTime = 0;

          audio.play().catch((err) => {
            console.log("Audio play blocked:", err);
          });
        }

        async function initLang() {
          await loadTranslations();

          const savedLang = localStorage.getItem(LANG_KEY);
          const currentLang =
            savedLang && translations[savedLang] ? savedLang : DEFAULT_LANG;

          applyLanguage(currentLang);

          const englishBtn = document.querySelector(".english-button");
          const hindiBtn = document.querySelector(".hindi-button");
          const gujratiBtn = document.querySelector(".gujrati-button");

          const englishAudio = document.getElementById("englishAudio");
          const hindiAudio = document.getElementById("hindiAudio");
          const gujratiAudio = document.getElementById("gujratiAudio");

          function addLanguageButtonAudio(button, lang, langAudio) {
            if (!button) return;

            // only language audio on click
            button.addEventListener("click", () => {
              playAudio(langAudio);
              applyLanguage(lang);
            });
          }

          addLanguageButtonAudio(englishBtn, "English", englishAudio);
          addLanguageButtonAudio(hindiBtn, "Hindi", hindiAudio);
          addLanguageButtonAudio(gujratiBtn, "Gujarati", gujratiAudio);

          window.setLanguage = applyLanguage;
        }

        document.addEventListener("DOMContentLoaded", initLang);
      })();
    </script>

    <script>
      window.addEventListener("load", () => {
        const wrap = document.querySelector(".flower-container");
        const homeLink = document.querySelector(".back-btn a");

        const flowerSfx = document.getElementById("NavigateClick");
        const clickSfx = document.getElementById("clickEffect");

        if ((!wrap && !homeLink) || !clickSfx) return;

        const play = async (audio) => {
          if (!audio) return;

          try {
            audio.pause();
            audio.currentTime = 0;
            await audio.play();
          } catch (_) {}
        };

        const stop = (audio) => {
          if (!audio) return;

          audio.pause();
          audio.currentTime = 0;
        };

        if (homeLink) {
          homeLink.addEventListener("click", async (e) => {
            e.preventDefault();

            const href = homeLink.getAttribute("href");

            await play(clickSfx);

            setTimeout(() => {
              window.location.href = href;
            }, 200);
          });
        }

        if (wrap) {
          wrap.addEventListener("click", (e) => {
            const a = e.target.closest("a.flower");
            if (!a || !wrap.contains(a)) return;

            e.preventDefault();

            const href = a.getAttribute("href");

            stop(clickSfx);
            play(flowerSfx);

            document.body.classList.add("page-exit");

            setTimeout(() => {
              window.location.href = href;
            }, 500);
          });
        }
      });
    </script>

    <!-- ================= VIDEO POPUP PLAYER ================= -->
    <script>
      (() => {
        const videoPlayClickSound = new Audio("./assets/audio/5.mp3");

        function playClickSound(audio) {
          audio.currentTime = 0;
          audio.play().catch((err) => {
            console.error("Error playing click sound:", err);
          });
        }

        const startVideoBtn = document.querySelector(".start-video-btn");
        const videoPopup = document.querySelector(".video-popup");
        const videoBox = document.querySelector(".video-box");
        const closeVideoBtn = document.querySelector(".close-video-btn");
        const popupVideo = document.querySelector(".popup-video");
        const popupVideoFrame = document.querySelector(".popup-video-frame");

        if (!videoPopup || !popupVideo) return;

        const centerPlayBtn = document.querySelector(".video-center-play");
        const playPauseBtn = document.querySelector(".play-pause-btn");
        const playPauseIcon = playPauseBtn.querySelector("i");
        const centerPlayIcon = centerPlayBtn.querySelector("i");

        const videoProgress = document.querySelector(".video-progress");
        const currentTimeText = document.querySelector(".current-time");
        const totalTimeText = document.querySelector(".total-time");

        const muteBtn = document.querySelector(".mute-btn");
        const muteIcon = muteBtn.querySelector("i");
        const volumeRange = document.querySelector(".volume-range");

        const fullscreenBtn = document.querySelector(".fullscreen-btn");
        const fullscreenIcon = fullscreenBtn.querySelector("i");

        let controlsTimer;
        let lastVolume = 1;
        let savedVideoTime = 0;
        let isProgressDragging = false;

        function formatTime(time) {
          if (!time || isNaN(time)) return "0:00";

          const minutes = Math.floor(time / 60);
          const seconds = Math.floor(time % 60);

          return `${minutes}:${seconds < 10 ? "0" : ""}${seconds}`;
        }

        function updatePlayIcons() {
          if (popupVideo.paused) {
            playPauseIcon.className = "fa-solid fa-play";
            centerPlayIcon.className = "fa-solid fa-play";
            centerPlayBtn.classList.remove("hide");
          } else {
            playPauseIcon.className = "fa-solid fa-pause";
            centerPlayIcon.className = "fa-solid fa-pause";
            centerPlayBtn.classList.add("hide");
          }
        }

        function updateProgress() {
          if (!popupVideo.duration) return;

          savedVideoTime = popupVideo.currentTime;

          if (!isProgressDragging) {
            const progressValue =
              (popupVideo.currentTime / popupVideo.duration) * 100;

            videoProgress.value = progressValue;
          }

          currentTimeText.textContent = formatTime(popupVideo.currentTime);
          totalTimeText.textContent = formatTime(popupVideo.duration);
        }

        // Free scrubbing: user can drag forward or backward anywhere on the bar
        function handleProgressInput() {
          if (!popupVideo.duration) return;

          isProgressDragging = true;

          const selectedTime =
            (Number(videoProgress.value) / 100) * popupVideo.duration;

          currentTimeText.textContent = formatTime(selectedTime);
        }

        function handleProgressChange() {
          if (!popupVideo.duration) return;

          const selectedTime =
            (Number(videoProgress.value) / 100) * popupVideo.duration;

          popupVideo.currentTime = selectedTime;
          savedVideoTime = selectedTime;

          isProgressDragging = false;
          updateProgress();
        }

        function updateMuteIcon() {
          if (popupVideo.muted || popupVideo.volume === 0) {
            muteIcon.className = "fa-solid fa-volume-xmark";
          } else if (popupVideo.volume < 0.5) {
            muteIcon.className = "fa-solid fa-volume-low";
          } else {
            muteIcon.className = "fa-solid fa-volume-high";
          }
        }

        function togglePlay() {
          if (popupVideo.paused) {
            popupVideo.play().catch(() => {});
          } else {
            popupVideo.pause();
          }
        }

        function openVideoPopup() {
          document.body.classList.add("video-open");
          videoPopup.classList.add("active");

          popupVideo.volume = Number(volumeRange.value);
          popupVideo.muted = false;

          if (savedVideoTime > 0) {
            popupVideo.currentTime = savedVideoTime;
          }

          updateMuteIcon();
          updatePlayIcons();
          updateProgress();

          setTimeout(() => {
            popupVideo.play().catch(() => {});
          }, 250);
        }

        function closeVideoPopup() {
          savedVideoTime = popupVideo.currentTime;

          popupVideo.pause();

          videoPopup.classList.remove("active");
          document.body.classList.remove("video-open");

          if (document.fullscreenElement) {
            document.exitFullscreen().catch(() => {});
          }

          updatePlayIcons();
        }

        function toggleMute() {
          if (popupVideo.muted || popupVideo.volume === 0) {
            popupVideo.muted = false;
            popupVideo.volume = lastVolume || 1;
            volumeRange.value = popupVideo.volume;
          } else {
            lastVolume = popupVideo.volume;
            popupVideo.muted = true;
            volumeRange.value = 0;
          }

          updateMuteIcon();
        }

        function changeVolume() {
          const volumeValue = Number(volumeRange.value);

          popupVideo.volume = volumeValue;
          popupVideo.muted = volumeValue === 0;

          if (volumeValue > 0) {
            lastVolume = volumeValue;
          }

          updateMuteIcon();
        }

        function toggleFullscreen() {
          if (!document.fullscreenElement) {
            videoBox.requestFullscreen().catch(() => {});
          } else {
            document.exitFullscreen().catch(() => {});
          }
        }

        function updateFullscreenIcon() {
          fullscreenIcon.className = document.fullscreenElement
            ? "fa-solid fa-compress"
            : "fa-solid fa-expand";
        }

        function showControlsTemporarily() {
          popupVideoFrame.classList.remove("controls-hidden");

          clearTimeout(controlsTimer);

          if (!popupVideo.paused) {
            controlsTimer = setTimeout(() => {
              popupVideoFrame.classList.add("controls-hidden");
            }, 2200);
          }
        }

        if (startVideoBtn) {
          startVideoBtn.addEventListener("click", () => {
            playClickSound(videoPlayClickSound);
            openVideoPopup();
          });
        }

        if (closeVideoBtn) {
          closeVideoBtn.addEventListener("click", closeVideoPopup);
        }

        videoPopup.addEventListener("click", (e) => {
          if (e.target === videoPopup) {
            closeVideoPopup();
          }
        });

        popupVideo.addEventListener("click", togglePlay);
        popupVideo.addEventListener("play", updatePlayIcons);
        popupVideo.addEventListener("pause", updatePlayIcons);
        popupVideo.addEventListener("timeupdate", updateProgress);
        popupVideo.addEventListener("loadedmetadata", updateProgress);

        popupVideo.addEventListener("ended", () => {
          savedVideoTime = 0;
          videoProgress.value = 0;
          currentTimeText.textContent = "0:00";
          updatePlayIcons();
        });

        popupVideo.addEventListener("contextmenu", (e) => {
          e.preventDefault();
        });

        videoProgress.addEventListener("input", handleProgressInput);
        videoProgress.addEventListener("change", handleProgressChange);

        videoProgress.addEventListener("mousedown", () => {
          isProgressDragging = true;
        });

        videoProgress.addEventListener("touchstart", () => {
          isProgressDragging = true;
        });

        centerPlayBtn.addEventListener("click", togglePlay);
        playPauseBtn.addEventListener("click", togglePlay);
        muteBtn.addEventListener("click", toggleMute);
        volumeRange.addEventListener("input", changeVolume);
        fullscreenBtn.addEventListener("click", toggleFullscreen);

        popupVideoFrame.addEventListener("mousemove", showControlsTemporarily);
        popupVideoFrame.addEventListener("click", showControlsTemporarily);

        document.addEventListener("fullscreenchange", updateFullscreenIcon);

        document.addEventListener("keydown", (e) => {
          if (!videoPopup.classList.contains("active")) return;
          if (!e.key) return;

          if (e.key === "Escape") {
            closeVideoPopup();
          }

          if (e.code === "Space") {
            e.preventDefault();
            togglePlay();
          }

          if (e.key.toLowerCase() === "m") {
            toggleMute();
          }

          if (e.key.toLowerCase() === "f") {
            toggleFullscreen();
          }
        });
      })();
    </script>
  </body>
</html>
